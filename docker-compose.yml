services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: parser
      POSTGRES_PASSWORD: parser
      POSTGRES_DB: parser
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parser -d parser']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible stand-in for R2. MinIO no longer publishes Docker images.
  s3:
    image: chrislusf/seaweedfs:4.50
    command: server -s3 -dir=/data
    ports:
      - '8333:8333'
    volumes:
      - s3_data:/data

  parser:
    build:
      context: .
      target: dev
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      DATABASE_URL: 'postgresql://parser:parser@postgres:5432/parser'
      MINIO_ENDPOINT: 'http://s3:8333'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: videos
      MINIO_REGION: us-east-1
      CORS_ORIGINS: 'http://localhost:8081,http://localhost:19006'
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    command:
      - sh
      - -c
      - bun x prisma generate && bun x prisma migrate deploy && bun run start:dev
    volumes:
      - .:/app
      - parser_node_modules:/app/node_modules

volumes:
  postgres_data:
  s3_data:
  parser_node_modules:
